<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#ffffff" />

    <link rel="manifest" href="manifest.json" />

    <title>Розрахунок вартості за 100грам</title>
  </head>

  <body>
    <script>
      alert("Визначення суми товару, за 100 грам продукту");
      const weight = +prompt("Введіть кількість товару у грамах.");

      const priceForTheProduct = +prompt("Введіть ціну товару.");

      const grams = 100;

      const gramsReceived = weight / grams;
      const amountReceived = priceForTheProduct / gramsReceived;

      const result = `Сума за 100 грам: ${amountReceived.toFixed(2)} гривень.
Введена кількість товару: ${weight} грам.
Введена ціна товару: ${priceForTheProduct} гривень.`;

      alert(result);

      // if ("serviceWorker" in navigator) {
      //   navigator.serviceWorker.register("sw.js");
      // }
    </script>
  </body>
</html>
