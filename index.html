<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- <meta name="theme-color" content="#ffffff" /> -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- <link rel="manifest" href="manifest.json" /> -->

    <title>Калькулятор ціни</title>
  </head>

  <body>
    <div class="calculator">
      <h1 class="hero-title">Калькулятор ціни</h1>
      <p>Визначення вартості за 100 грам</p>

      <div>
        <lable for="weight">Введіть кількість товару (г).</lable>
        <input
          type="number"
          name="weight"
          id="weight"
          placeholder="Наприклад: 500"
        />
      </div>

      <div>
        <lable for="price">Введіть ціну товару (грн).</lable>
        <input
          type="number"
          name="price"
          id="price"
          placeholder="Наприклад: 120"
        />
        <button onclick="calculate()">Розрахувати</button>
        <div class="result" id="result">
          <p>Введіть дані та натисніть «Розрахувати»</p>
        </div>
      </div>
    </div>
